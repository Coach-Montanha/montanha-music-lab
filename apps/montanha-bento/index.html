<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Montanha Music" />
    <link rel="manifest" href="/manifest.json" />
    <title>Montanha Music • Streaming & Playlists</title>
    <!-- Sessão de Áudio Nativa do WebKit / Safari (iOS 16.4+) -->
    <script>
      try {
        if ('audioSession' in navigator) {
          navigator.audioSession.type = 'playback';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#121212] text-white antialiased selection:bg-[#1DB954] selection:text-black overscroll-none">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(console.warn);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
