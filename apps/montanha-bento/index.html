<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/music.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Able" />
    <link rel="manifest" href="/manifest.json" />
    <title>Able • Free Music Streaming</title>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#121212] text-white antialiased selection:bg-[#1DB954] selection:text-black overscroll-none">
    <div id="able-yt-player" style="position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:1;pointer-events:none;z-index:-1;overflow:hidden;"></div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(console.warn);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
