<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/music.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Montanha Music" />
    <link rel="manifest" href="/manifest.json" />
    <title>Montanha Music Lab • Streaming & Playlists</title>
    <!-- GUARDIÃO DE REPRODUÇÃO EM BACKGROUND & TELA BLOQUEADA -->
    <script>
      (function() {
        try {
          // 1. Engana o Page Visibility API para que o player do YouTube acredite que a tela está sempre ligada e visível
          Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
          Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
          if ('webkitHidden' in document) {
            Object.defineProperty(document, 'webkitHidden', { get: () => false, configurable: true });
            Object.defineProperty(document, 'webkitVisibilityState', { get: () => 'visible', configurable: true });
          }
          // 2. Bloqueia eventos de blur e visibilitychange para que scripts internos não pausem o áudio
          const blockedEvents = ['visibilitychange', 'webkitvisibilitychange', 'blur'];
          blockedEvents.forEach(function(evt) {
            window.addEventListener(evt, function(e) { e.stopImmediatePropagation(); }, true);
            document.addEventListener(evt, function(e) { e.stopImmediatePropagation(); }, true);
          });
          // 3. Configura a sessão de áudio nativa do WebKit / Safari (iOS 16.4+)
          if ('audioSession' in navigator) {
            navigator.audioSession.type = 'playback';
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#121212] text-white antialiased selection:bg-[#1DB954] selection:text-black overscroll-none">
    <div id="able-yt-player" style="position:fixed;bottom:0;right:0;width:240px;height:240px;opacity:0.001;pointer-events:none;z-index:0;overflow:hidden;"></div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(console.warn);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
