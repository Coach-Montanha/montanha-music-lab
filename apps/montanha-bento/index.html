<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/music.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Montanha Music" />
    <link rel="manifest" href="/manifest.json" />
    <title>Montanha Music Lab • Streaming & Playlists</title>
    <!-- GUARDIÃO DE REPRODUÇÃO EM BACKGROUND & TELA BLOQUEADA (PADRÃO MOZILLA VIDEO-BG-PLAY) -->
    <script>
      (function() {
        try {
          // 1. Engana o Page Visibility API e Document Focus em document e no prototype
          Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
          Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
          if (typeof Document !== 'undefined' && Document.prototype) {
            Object.defineProperty(Document.prototype, 'hidden', { get: () => false, configurable: true });
            Object.defineProperty(Document.prototype, 'visibilityState', { get: () => 'visible', configurable: true });
            Document.prototype.hasFocus = () => true;
          }
          document.hasFocus = () => true;
          if ('webkitHidden' in document) {
            Object.defineProperty(document, 'webkitHidden', { get: () => false, configurable: true });
            Object.defineProperty(document, 'webkitVisibilityState', { get: () => 'visible', configurable: true });
          }

          // 2. Intercepta addEventListener no EventTarget para impedir que scripts internos e iframes
          // registrem ouvintes de visibilidade ou desfoque que pausam o player
          const origAEL = EventTarget.prototype.addEventListener;
          EventTarget.prototype.addEventListener = function(type, listener, options) {
            if (type === 'visibilitychange' || type === 'webkitvisibilitychange' || type === 'blur' || type === 'pagehide') {
              return;
            }
            return origAEL.call(this, type, listener, options);
          };

          // Limpa handlers legados inline de blur e visibility
          window.onblur = null;
          window.onfocus = null;
          document.onvisibilitychange = null;

          // 3. Configura a sessão de áudio nativa do WebKit / Safari (iOS 16.4+)
          if ('audioSession' in navigator) {
            navigator.audioSession.type = 'playback';
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#121212] text-white antialiased selection:bg-[#1DB954] selection:text-black overscroll-none">
    <div id="able-yt-player" style="position:fixed;bottom:0;right:0;width:240px;height:240px;opacity:0.99;pointer-events:none;z-index:-1;overflow:hidden;"></div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(console.warn);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
