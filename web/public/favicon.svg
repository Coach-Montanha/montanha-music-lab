<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#060709" />
  <circle cx="256" cy="256" r="230" fill="url(#bg_grad)" stroke="#0284c7" stroke-width="8" stroke-opacity="0.3" />
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d" />
      <stop offset="0.5" stop-color="#07090e" />
      <stop offset="1" stop-color="#020305" />
    </linearGradient>
    <linearGradient id="brand_grad" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#0066cc" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="wave_grad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Glowing Sound Waves -->
  <rect x="140" y="216" width="16" height="80" rx="8" fill="url(#brand_grad)" opacity="0.8" />
  <rect x="175" y="166" width="16" height="180" rx="8" fill="url(#brand_grad)" opacity="0.9" />
  <rect x="210" y="126" width="16" height="260" rx="8" fill="url(#brand_grad)" />
  <rect x="248" y="186" width="16" height="140" rx="8" fill="#ffffff" />
  <rect x="286" y="126" width="16" height="260" rx="8" fill="url(#brand_grad)" />
  <rect x="321" y="166" width="16" height="180" rx="8" fill="url(#brand_grad)" opacity="0.9" />
  <rect x="356" y="216" width="16" height="80" rx="8" fill="url(#brand_grad)" opacity="0.8" />

  <!-- Center Vinyl Center / Modern Node -->
  <circle cx="256" cy="256" r="32" fill="#0066cc" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
</svg>
